<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#F7F6F2" />
<title>Compra Familiar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    /* ---- Papel / tinta ---- */
    --paper:        #F7F6F2;
    --paper-raised: #FFFFFF;
    --paper-sunk:   #EFEDE4;
    --ink:          #1E2420;
    --ink-2:        #565D55;
    --ink-3:        #9A9C93;
    --line:         #E1DED2;
    --line-strong:  #CFCBBB;

    /* ---- Marca ---- */
    --brand:      #2B6B4A;
    --brand-deep: #1F4E37;
    --brand-soft: #E6EFE9;
    --tomato:      #C0503D;
    --tomato-soft: #F7E8E4;
    --gold:        #A9812F;
    --gold-soft:   #F3ECD9;

    /* ---- Categorías (paleta sobria) ---- */
    --cat-lacteos:    #5B84A8;
    --cat-carnes:     #B85450;
    --cat-verduras:   #4C8B5A;
    --cat-frutas:     #B15A82;
    --cat-panaderia:  #AD8A3F;
    --cat-bebidas:    #7B5EA0;
    --cat-despensa:   #B17438;
    --cat-limpieza:   #3F9488;
    --cat-farmacia:   #8A4F9E;
    --cat-vehiculo:   #5C6B73;
    --cat-otros:      #9A9488;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 1px 2px rgba(30,36,32,.06);
    --shadow-md: 0 6px 20px rgba(30,36,32,.08);
    --shadow-lg: 0 14px 34px rgba(30,36,32,.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding-bottom:118px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  ::selection{ background:var(--brand-soft); color:var(--brand-deep); }

  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, .item-check:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .display{ font-family:'Space Grotesk',sans-serif; }

  /* ================= HEADER ================= */
  .topbar{
    position:sticky; top:0; z-index:1000;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:12px 14px 10px;
  }

  .brand-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }

  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }

  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    flex-shrink:0;
  }

  .brand-text{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
  .brand-name{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-status{
    display:flex; align-items:center; gap:5px;
    font-size:11px; color:var(--ink-3); font-weight:500;
  }
  .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .dot.online{ background:var(--brand); animation:pulse 2.4s infinite; }
  .dot.offline{ background:var(--tomato); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .rate-chip{
    display:flex; align-items:center; gap:4px;
    background:var(--gold-soft); border-radius:999px;
    padding:5px 6px 5px 10px;
  }
  .rate-chip-label{ font-size:10px; font-weight:700; color:var(--gold); letter-spacing:.02em; }
  .rate-chip input{
    width:58px; border:none; background:transparent; text-align:right;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; color:var(--ink);
    padding:2px 4px;
  }

  .counter-badge{
    min-width:22px; height:22px; padding:0 6px; border-radius:999px;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px;
  }

  .search-row{
    position:relative; margin-bottom:10px;
  }
  .search-row svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke:var(--ink-3); pointer-events:none;
  }
  .search-input{
    width:100%; border:1px solid var(--line); background:var(--paper-raised);
    border-radius:var(--radius-md); padding:10px 12px 10px 34px;
    font-size:14px; font-weight:500; color:var(--ink);
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .search-input::placeholder{ color:var(--ink-3); font-weight:400; }
  .search-input:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);
  }

  .chip-row{
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:1px;
  }
  .chip-row::-webkit-scrollbar{ display:none; }

  .chip{
    display:flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer;
    padding:6px 12px 6px 9px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper-raised); font-size:12px; font-weight:600; color:var(--ink-2);
    transition:all .15s ease;
  }
  .chip:active{ transform:scale(.96); }
  .chip-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex-shrink:0; }
  .chip.active{
    background:var(--chip-color, var(--ink)); border-color:var(--chip-color, var(--ink)); color:#fff;
  }
  .chip.active .chip-dot{ background:#fff; }

  /* ================= LISTA ================= */
  .list{ padding:6px 0 4px; }

  .section-divider{
    display:flex; align-items:center; gap:10px;
    margin:20px 14px 6px; color:var(--ink-3);
    font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.06em;
  }
  .section-divider::before, .section-divider::after{
    content:''; flex:1; border-top:1px dashed var(--line-strong);
  }

  .item{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px; background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .item:active{ background:var(--paper-sunk); }

  .item.purchased{ background:var(--paper-sunk); }
  .item.purchased .item-name{ color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong); }
  .item.purchased .item-leader{ opacity:.4; }

  @keyframes pulseGold{
    0%{ box-shadow:inset 0 0 0 1px var(--gold), 0 0 0 0 rgba(169,129,47,.35); }
    100%{ box-shadow:inset 0 0 0 1px transparent, 0 0 0 10px rgba(169,129,47,0); }
  }
  .item.just-purchased{ animation:pulseGold 1.6s ease-out; }

  .item-check{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:2px solid var(--cat-color, var(--ink-3));
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .item-check:active{ transform:scale(.9); }
  .item.purchased .item-check{
    background:var(--brand); border-color:var(--brand);
    animation:checkPop .35s ease;
  }
  @keyframes checkPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.28); } 100%{ transform:scale(1); } }
  .item-check svg{
    width:13px; height:13px; stroke:#fff; opacity:0; transform:scale(.5);
    transition:opacity .18s ease .05s, transform .18s ease .05s;
  }
  .item.purchased .item-check svg{ opacity:1; transform:scale(1); }

  .item-body{ flex:1; min-width:0; cursor:pointer; }
  .item-top{ display:flex; align-items:baseline; gap:6px; }
  .item-name{
    font-size:14px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:3;
  }
  .item-leader{
    flex:1; min-width:10px; height:0; align-self:center;
    border-bottom:2px dotted var(--line-strong); margin:0 2px;
  }
  .item-meta{ font-size:11px; color:var(--ink-3); margin-top:2px; }
  .item-meta b{ color:var(--ink-2); font-weight:600; }

  .item-price{
    flex-shrink:0; border:none; background:var(--tomato-soft); color:var(--tomato);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    border-radius:var(--radius-sm); padding:7px 8px; min-width:64px; text-align:center;
    cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .item-price:active{ transform:scale(.94); background:#f0d9d2; }
  .item.purchased .item-price{ background:var(--brand-soft); color:var(--brand-deep); }

  .item-qty{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .qty-btn{
    width:25px; height:25px; border-radius:50%; border:1px solid var(--line-strong);
    background:var(--paper-raised); color:var(--ink); font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .15s ease, transform .12s ease;
  }
  .qty-btn:active{ background:var(--paper-sunk); transform:scale(.92); }
  .qty-value{ min-width:16px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; }

  .item-delete{
    flex-shrink:0; border:none; background:transparent; color:var(--ink-3);
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; border-radius:50%; transition:color .15s ease, background .15s ease;
  }
  .item-delete:active{ color:var(--tomato); background:var(--tomato-soft); }
  .item-delete svg{ width:15px; height:15px; }

  @media (max-width:380px){
    .item{ padding:10px 10px; gap:8px; }
    .item-price{ min-width:56px; font-size:12px; padding:6px; }
    .qty-btn{ width:23px; height:23px; }
  }

  /* ================= ESTADOS VACÍOS ================= */
  .empty-state{
    text-align:center; padding:64px 24px 40px; color:var(--ink-3);
  }
  .empty-state svg{ width:44px; height:44px; stroke:var(--line-strong); margin-bottom:14px; }
  .empty-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; color:var(--ink-2); }
  .empty-sub{ font-size:13px; margin-top:6px; }

  /* ================= FOOTER ================= */
  .summary-bar{
    position:fixed; bottom:0; width:100%; z-index:1000;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    box-shadow:0 -8px 24px rgba(30,36,32,.08);
    display:flex; align-items:stretch;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .summary-block{
    flex:1; padding:11px 8px; display:flex; flex-direction:column; align-items:center;
    border:none; background:transparent; cursor:default;
  }
  .summary-action{ cursor:pointer; transition:background .15s ease; }
  .summary-action:active{ background:var(--paper-sunk); }
  .summary-divider{ width:1px; background:var(--line); margin:10px 0; }
  .summary-label{
    font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:.07em; color:var(--ink-3);
  }
  .summary-value{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:19px; margin-top:2px; }
  .summary-value.tomato{ color:var(--tomato); }
  .summary-value.brand{ color:var(--brand); }
  .summary-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-3); margin-top:1px; }

  /* ================= FABs ================= */
  .fab-primary, .fab-secondary{
    position:fixed; right:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:1001; border:none; transition:transform .15s ease;
  }
  .fab-primary{
    bottom:132px; width:52px; height:52px;
    background:var(--ink); color:var(--paper); box-shadow:var(--shadow-lg);
  }
  .fab-primary svg{ width:22px; height:22px; stroke:var(--paper); }
  .fab-secondary{
    bottom:196px; width:42px; height:42px;
    background:var(--paper-raised); border:1px solid var(--line-strong); box-shadow:var(--shadow-md);
  }
  .fab-secondary svg{ width:18px; height:18px; stroke:var(--ink-2); }
  .fab-primary:active, .fab-secondary:active{ transform:scale(.92); }

  /* ================= LOADER / TOASTS ================= */
  #loader{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2000; display:none;
  }
  .spinner{
    width:34px; height:34px; border:3px solid var(--line); border-top:3px solid var(--brand);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ 100%{ transform:rotate(360deg); } }

  .toast-container{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:3000;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding-top:env(safe-area-inset-top);
  }
  .custom-toast{
    background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:999px;
    font-size:12px; font-weight:500; animation:fadeInOut 3s ease; box-shadow:var(--shadow-md);
  }
  .custom-toast.error{ background:var(--tomato); }
  @keyframes fadeInOut{
    0%{ opacity:0; transform:translateY(-8px); }
    12%{ opacity:1; transform:translateY(0); }
    88%{ opacity:1; transform:translateY(0); }
    100%{ opacity:0; transform:translateY(-8px); }
  }

  .toast-purchase{
    background:var(--brand-deep); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
    font-size:13px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-md);
    animation:slideIn .25s ease-out;
  }
  .toast-purchase b{ font-weight:600; }
  .toast-purchase .undo-btn{
    background:rgba(255,255,255,.16); border:none; color:#fff; padding:4px 10px;
    border-radius:999px; cursor:pointer; font-size:11px; font-weight:600;
  }
  @keyframes slideIn{ from{ transform:translateY(-14px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  /* ================= MODALES (SweetAlert2) ================= */
  .swal2-top{ align-items:flex-start !important; }
  .modal-top .swal2-popup{
    margin-top:56px !important; padding:0 !important; max-width:380px !important; width:92vw !important;
    border-radius:var(--radius-lg) !important; font-family:'Inter',sans-serif !important;
    display:flex !important; flex-direction:column !important; overflow:hidden !important;
  }
  .modal-top .swal2-header{ padding:18px 18px 6px !important; margin:0 !important; }
  .modal-top .swal2-title{
    font-family:'Space Grotesk',sans-serif !important; font-size:17px !important; font-weight:700 !important;
    color:var(--ink) !important; margin:0 !important; padding:0 !important;
  }
  .modal-top .swal2-html-container{ margin:0 !important; padding:0 18px 8px !important; font-size:12.5px !important; color:var(--ink-2) !important; }
  .modal-top .swal2-input, .modal-top .swal2-select{
    font-family:'IBM Plex Mono',monospace !important; font-size:16px !important; padding:12px !important;
    margin:6px 18px !important; border-radius:var(--radius-sm) !important; text-align:center !important;
    font-weight:600 !important; width:calc(100% - 36px) !important; box-sizing:border-box !important;
    border:1.5px solid var(--line-strong) !important; color:var(--ink) !important;
  }
  .modal-top .swal2-select{ font-family:'Inter',sans-serif !important; }
  .modal-top .swal2-input:focus, .modal-top .swal2-select:focus{
    border-color:var(--brand) !important; box-shadow:0 0 0 3px var(--brand-soft) !important;
  }
  .modal-top .swal2-actions{
    margin:0 !important; padding:14px !important; background:var(--paper) !important;
    border-top:1px solid var(--line) !important; width:100% !important; box-sizing:border-box !important;
    display:flex !important; flex-direction:column !important; gap:8px !important;
  }
  .modal-top .swal2-confirm, .modal-top .swal2-deny, .modal-top .swal2-cancel{
    font-family:'Inter',sans-serif !important; font-size:14.5px !important; padding:12px 16px !important;
    margin:0 !important; border-radius:var(--radius-sm) !important; font-weight:600 !important;
    width:100% !important; box-sizing:border-box !important; box-shadow:none !important;
  }
  .modal-top .swal2-confirm{ background:var(--brand) !important; order:1 !important; }
  .modal-top .swal2-deny{ background:var(--ink) !important; order:2 !important; }
  .modal-top .swal2-cancel{ background:var(--paper-sunk) !important; color:var(--ink-2) !important; order:3 !important; }
  .modal-top .swal2-validation-message{ font-size:11.5px !important; padding:0 18px !important; margin:4px 0 !important; background:transparent !important; color:var(--tomato) !important; }
  .modal-top .swal2-icon{ margin-top:6px !important; }

  .modal-historial .swal2-popup{ width:95vw !important; max-width:500px !important; }
  .modal-historial .swal2-actions{ flex-direction:row !important; justify-content:center !important; }
  .modal-historial .swal2-confirm{ width:auto !important; min-width:120px !important; }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>

<body>

<div id="loader"><div class="spinner"></div></div>
<div id="toastContainer" class="toast-container"></div>

<header class="topbar">
  <div class="brand-row">
    <div class="brand">
      <span class="brand-mark">CF</span>
      <div class="brand-text">
        <span class="brand-name">Compra Familiar</span>
        <span class="brand-status"><i id="statusDot" class="dot online"></i><span id="statusText">En línea</span></span>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="rate-chip">
        <span class="rate-chip-label">Bs</span>
        <input type="text" id="tasaCambio" inputmode="decimal" onchange="actualizarTasa(this.value)">
      </label>
      <span id="contadorItems" class="counter-badge">0</span>
    </div>
  </div>

  <div class="search-row">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar producto…" oninput="filtrarProductos()">
  </div>

  <div class="chip-row" id="categoryFilter">
    <div class="chip active" data-cat="todos" onclick="filtrarCategoria('todos')"><span class="chip-dot"></span>Todos</div>
    <div class="chip" data-cat="lacteos" onclick="filtrarCategoria('lacteos')" style="--chip-color:var(--cat-lacteos)"><span class="chip-dot" style="background:var(--cat-lacteos)"></span>Lácteos</div>
    <div class="chip" data-cat="carnes" onclick="filtrarCategoria('carnes')" style="--chip-color:var(--cat-carnes)"><span class="chip-dot" style="background:var(--cat-carnes)"></span>Carnes</div>
    <div class="chip" data-cat="verduras" onclick="filtrarCategoria('verduras')" style="--chip-color:var(--cat-verduras)"><span class="chip-dot" style="background:var(--cat-verduras)"></span>Verduras</div>
    <div class="chip" data-cat="frutas" onclick="filtrarCategoria('frutas')" style="--chip-color:var(--cat-frutas)"><span class="chip-dot" style="background:var(--cat-frutas)"></span>Frutas</div>
    <div class="chip" data-cat="panaderia" onclick="filtrarCategoria('panaderia')" style="--chip-color:var(--cat-panaderia)"><span class="chip-dot" style="background:var(--cat-panaderia)"></span>Panadería</div>
    <div class="chip" data-cat="bebidas" onclick="filtrarCategoria('bebidas')" style="--chip-color:var(--cat-bebidas)"><span class="chip-dot" style="background:var(--cat-bebidas)"></span>Bebidas</div>
    <div class="chip" data-cat="despensa" onclick="filtrarCategoria('despensa')" style="--chip-color:var(--cat-despensa)"><span class="chip-dot" style="background:var(--cat-despensa)"></span>Despensa</div>
    <div class="chip" data-cat="limpieza" onclick="filtrarCategoria('limpieza')" style="--chip-color:var(--cat-limpieza)"><span class="chip-dot" style="background:var(--cat-limpieza)"></span>Limpieza</div>
    <div class="chip" data-cat="farmacia" onclick="filtrarCategoria('farmacia')" style="--chip-color:var(--cat-farmacia)"><span class="chip-dot" style="background:var(--cat-farmacia)"></span>Farmacia</div>
    <div class="chip" data-cat="vehiculo" onclick="filtrarCategoria('vehiculo')" style="--chip-color:var(--cat-vehiculo)"><span class="chip-dot" style="background:var(--cat-vehiculo)"></span>Vehículo</div>
    <div class="chip" data-cat="otros" onclick="filtrarCategoria('otros')" style="--chip-color:var(--cat-otros)"><span class="chip-dot" style="background:var(--cat-otros)"></span>Otros</div>
  </div>
</header>

<main id="listaProductos" class="list"></main>

<button class="fab-secondary" onclick="mostrarHistorial()" aria-label="Ver historial">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
</button>
<button class="fab-primary" onclick="nuevoProducto()" aria-label="Agregar producto">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<footer class="summary-bar">
  <div class="summary-block">
    <span class="summary-label">Falta</span>
    <span id="totalPendiente" class="summary-value tomato">$0,00</span>
  </div>
  <div class="summary-divider"></div>
  <button class="summary-block summary-action" onclick="archivar()">
    <span class="summary-label">Archivar carrito</span>
    <span id="totalComprado" class="summary-value brand">$0,00</span>
    <span id="totalBs" class="summary-sub">Bs 0,00</span>
  </button>
</footer>

<script>
  const SUPABASE_URL = 'https://xqfdgyaukxjlzpmchhzr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxZmRneWF1a3hqbHpwbWNoaHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDIyMDYsImV4cCI6MjA5NzcxODIwNn0.S5tn9_Dkund3H_bP3uWlYsYgxnokrfiUwlHa0c6bM-E';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let productos = [];
  let exchangeRate = 36.50;
  let realtimeChannel = null;
  let ultimoProductoComprado = null;
  let timeoutHighlight = null;
  let modalAbierto = false;
  let categoriaActual = 'todos';
  let busquedaActual = '';

  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

  document.addEventListener('DOMContentLoaded', () => {
    cargarDatosIniciales();
    suscribirseACambios();
  });

  async function cargarDatosIniciales() {
    showLoader(true);
    try {
      const { data: configData, error: configError } = await supabaseClient
        .from('config').select('exchange_rate').single();
      if (configError) throw configError;
      exchangeRate = configData?.exchange_rate || 36.50;
      document.getElementById('tasaCambio').value = exchangeRate.toString().replace('.', ',');

      const { data: productsData, error: productsError } = await supabaseClient
        .from('products').select('*').order('created_at', { ascending: false });
      if (productsError) throw productsError;
      productos = productsData || [];

      renderizar();
      showToast('Sincronizado');
    } catch (error) {
      console.error('Error:', error);
      showToast('Error de conexión', 'error');
      marcarOnline(false);
    } finally {
      showLoader(false);
    }
  }

  function suscribirseACambios() {
    realtimeChannel = supabaseClient
      .channel('shopping-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' },
        (payload) => {
          if (modalAbierto) return;
          sincronizarCambios(payload);
        }
      )
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'config' },
        (payload) => {
          exchangeRate = payload.new.exchange_rate;
          document.getElementById('tasaCambio').value = exchangeRate.toString().replace('.', ',');
          if (!modalAbierto) renderizar();
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') marcarOnline(true);
        else if (status === 'CHANNEL_ERROR') marcarOnline(false);
      });
  }

  async function sincronizarCambios(payload) {
    const { eventType, new: nuevo, old: viejo } = payload;
    if (eventType === 'INSERT') productos.push(nuevo);
    else if (eventType === 'UPDATE') {
      const index = productos.findIndex(p => p.id === nuevo.id);
      if (index !== -1) productos[index] = nuevo;
    } else if (eventType === 'DELETE') {
      productos = productos.filter(p => p.id !== viejo.id);
    }
    renderizar();
  }

  function filtrarProductos() {
    busquedaActual = document.getElementById('searchInput').value.toLowerCase().trim();
    renderizar();
  }

  function filtrarCategoria(categoria) {
    categoriaActual = categoria;
    document.querySelectorAll('.chip').forEach(chip => {
      chip.classList.remove('active');
      if (chip.dataset.cat === categoria) chip.classList.add('active');
    });
    renderizar();
  }

  function getCategoryName(cat) {
    const names = {
      lacteos: 'Lácteos', carnes: 'Carnes', verduras: 'Verduras', frutas: 'Frutas',
      panaderia: 'Panadería', bebidas: 'Bebidas', despensa: 'Despensa', limpieza: 'Limpieza',
      farmacia: 'Farmacia', vehiculo: 'Vehículo', otros: 'Otros'
    };
    return names[cat] || 'Otros';
  }

  function getCategoryColor(cat) {
    const colors = {
      lacteos: 'var(--cat-lacteos)', carnes: 'var(--cat-carnes)', verduras: 'var(--cat-verduras)',
      frutas: 'var(--cat-frutas)', panaderia: 'var(--cat-panaderia)', bebidas: 'var(--cat-bebidas)',
      despensa: 'var(--cat-despensa)', limpieza: 'var(--cat-limpieza)', farmacia: 'var(--cat-farmacia)',
      vehiculo: 'var(--cat-vehiculo)', otros: 'var(--cat-otros)'
    };
    return colors[cat] || 'var(--cat-otros)';
  }

  function renderizar() {
    let productosFiltrados = [...productos];

    if (busquedaActual) {
      productosFiltrados = productosFiltrados.filter(p =>
        p.name.toLowerCase().includes(busquedaActual)
      );
    }

    if (categoriaActual !== 'todos') {
      productosFiltrados = productosFiltrados.filter(p =>
        (p.category || 'otros') === categoriaActual
      );
    }

    const productosOrdenados = [...productosFiltrados].sort((a, b) =>
      a.name.toLowerCase().localeCompare(b.name.toLowerCase(), 'es', { sensitivity: 'base' })
    );

    const pendientes = productosOrdenados.filter(p => p.status === 'pending');
    const comprados = productosOrdenados.filter(p => p.status === 'purchased');

    let html = '';
    let totalPendiente = 0;
    let totalComprado = 0;

    pendientes.forEach(p => { totalPendiente += parseFloat(p.price || 0) * parseInt(p.quantity || 1); });
    comprados.forEach(p => { totalComprado += parseFloat(p.price || 0) * parseInt(p.quantity || 1); });

    // Lista única ordenada alfabéticamente, sin agrupar por categoría
    pendientes.forEach(p => {
      const subtotal = parseFloat(p.price || 0) * parseInt(p.quantity || 1);
      html += crearItemHTML(p, subtotal, false, getCategoryColor(p.category || 'otros'));
    });

    if (comprados.length > 0) {
      html += `<div class="section-divider"><span>En tu carrito</span></div>`;
      comprados.forEach(p => {
        html += crearItemHTML(p, 0, p.id === ultimoProductoComprado, getCategoryColor(p.category || 'otros'));
      });
    }

    if (productosFiltrados.length === 0) {
      if (productos.length === 0) {
        html = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <div class="empty-title">Tu lista está vacía</div>
            <div class="empty-sub">Toca el botón + para agregar el primer producto</div>
          </div>`;
      } else {
        html = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <div class="empty-title">Sin resultados</div>
            <div class="empty-sub">Prueba con otra búsqueda o categoría</div>
          </div>`;
      }
    }

    document.getElementById('listaProductos').innerHTML = html;
    document.getElementById('totalPendiente').innerText = `$${formatear(totalPendiente)}`;
    document.getElementById('totalComprado').innerText = `$${formatear(totalComprado)}`;
    document.getElementById('totalBs').innerText = `Bs ${formatear(totalComprado * exchangeRate)}`;
    document.getElementById('contadorItems').innerText = pendientes.length;

    if (timeoutHighlight) clearTimeout(timeoutHighlight);
    timeoutHighlight = setTimeout(() => {
      ultimoProductoComprado = null;
      if (productos.some(p => p.status === 'purchased')) renderizar();
    }, 2200);
  }

  function crearItemHTML(producto, subtotal, esUltimoComprado = false, catColor = 'var(--cat-otros)') {
    const esPendiente = producto.status === 'pending';
    const claseExtra = esUltimoComprado ? 'just-purchased' : '';
    const subtotalReal = parseFloat(producto.price || 0) * parseInt(producto.quantity || 1);

    return `
      <div class="item ${esPendiente ? '' : 'purchased'} ${claseExtra}" style="--cat-color:${catColor}">
        <button class="item-check" onclick="cambiarEstado('${producto.id}', '${producto.status}')" aria-label="Marcar como comprado">${ICON_CHECK}</button>
        <div class="item-body" onclick="cambiarEstado('${producto.id}', '${producto.status}')">
          <div class="item-top">
            <span class="item-name">${escapeHtml(producto.name)}</span>
            <span class="item-leader"></span>
          </div>
          <div class="item-meta">${producto.quantity} × $${formatear(producto.price || 0)} · <b>$${formatear(subtotalReal)}</b></div>
        </div>
        <button class="item-price" onclick="editarPrecio('${producto.id}')">$${formatear(producto.price || 0)}</button>
        <div class="item-qty">
          <button class="qty-btn" onclick="ajustarCantidad('${producto.id}', ${producto.quantity - 1})">−</button>
          <span class="qty-value">${producto.quantity}</span>
          <button class="qty-btn" onclick="ajustarCantidad('${producto.id}', ${producto.quantity + 1})">+</button>
        </div>
        <button class="item-delete" onclick="borrarProducto('${producto.id}', '${escapeHtml(producto.name)}')" aria-label="Eliminar producto">${ICON_TRASH}</button>
      </div>`;
  }

  async function editarPrecio(productId) {
    const producto = productos.find(p => p.id === productId);
    if (!producto) return;

    modalAbierto = true;

    const { value: resultado, isConfirmed, isDenied } = await Swal.fire({
      title: 'Precio',
      html: `
        <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:4px;font-weight:600;">${escapeHtml(producto.name)}</div>
        <div style="font-size:11px;color:var(--ink-3);">Actual: $${formatear(producto.price || 0)}</div>
      `,
      input: 'text',
      inputValue: formatear(producto.price || 0),
      inputAttributes: {
        'inputmode': 'decimal', 'enterkeyhint': 'done', 'autocomplete': 'off',
        'autocapitalize': 'off', 'spellcheck': 'false'
      },
      inputValidator: (value) => {
        if (!value || value.trim() === '') return 'Ingresa un precio';
        const num = parseFloat(value.replace(',', '.'));
        if (isNaN(num)) return 'Precio inválido';
        if (num < 0) return 'No puede ser negativo';
      },
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: 'Guardar',
      denyButtonText: 'Calculadora',
      cancelButtonText: 'Cancelar',
      allowOutsideClick: false,
      allowEscapeKey: true,
      position: 'top',
      customClass: { container: 'modal-top', popup: 'modal-top-popup' },
      didOpen: () => {
        setTimeout(() => {
          const input = document.querySelector('.swal2-input');
          if (input) { input.focus(); input.select(); }
        }, 100);
      }
    });

    modalAbierto = false;

    if (isDenied) { await abrirCalculadoraPrecio(productId); return; }

    if (isConfirmed && resultado) {
      const precio = parseFloat(resultado.replace(',', '.')) || 0;
      await guardarPrecio(productId, precio);
    }

    await recargarDatos();
  }

  async function abrirCalculadoraPrecio(productId) {
    const producto = productos.find(p => p.id === productId);
    if (!producto) return;

    modalAbierto = true;

    const { value: resultado, isConfirmed, isDenied } = await Swal.fire({
      title: 'Calculadora',
      html: `
        <div style="font-size:11.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600;">${escapeHtml(producto.name)}</div>
        <div style="background:var(--brand-soft);padding:8px;border-radius:8px;font-size:10.5px;color:var(--brand-deep);">
          Ej: <code>1.2+1.5</code> · <code>10*2</code> · <code>50-10</code>
        </div>
      `,
      input: 'text',
      inputPlaceholder: '1.2+1.5+2.3',
      inputAttributes: {
        'inputmode': 'text', 'enterkeyhint': 'done', 'autocomplete': 'off',
        'autocapitalize': 'off', 'spellcheck': 'false'
      },
      inputValidator: (value) => {
        if (!value || value.trim() === '') return 'Ingresa una expresión';
        try {
          const r = evaluarExpresion(value);
          if (isNaN(r) || !isFinite(r)) return 'Inválida';
          if (r < 0) return 'No negativo';
        } catch (e) { return 'Error'; }
      },
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: 'Asignar',
      denyButtonText: 'Atrás',
      cancelButtonText: 'Cancelar',
      allowOutsideClick: false,
      position: 'top',
      customClass: { container: 'modal-top', popup: 'modal-top-popup' },
      didOpen: () => {
        setTimeout(() => {
          const input = document.querySelector('.swal2-input');
          if (input) input.focus();
        }, 100);
      }
    });

    modalAbierto = false;

    if (isDenied) { await editarPrecio(productId); return; }

    if (isConfirmed && resultado) {
      try {
        const precioFinal = evaluarExpresion(resultado);

        const confirmar = await Swal.fire({
          title: '¿Asignar?',
          html: `
            <div style="font-family:'IBM Plex Mono',monospace;background:var(--paper-sunk);padding:8px;border-radius:8px;margin:6px 0;">
              ${resultado} = <b>$${formatear(precioFinal)}</b>
            </div>
            <div style="font-size:11px;color:var(--ink-3);">${escapeHtml(producto.name)}</div>
          `,
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'Sí, asignar',
          cancelButtonText: 'Cancelar',
          position: 'top',
          customClass: { container: 'modal-top', popup: 'modal-top-popup' }
        });

        if (confirmar.isConfirmed) {
          await guardarPrecio(productId, precioFinal);
          showToast(`$${formatear(precioFinal)}`);
        } else {
          await abrirCalculadoraPrecio(productId);
          return;
        }
      } catch (e) {
        showToast('Error', 'error');
        await abrirCalculadoraPrecio(productId);
        return;
      }
    }

    await recargarDatos();
  }

  async function guardarPrecio(productId, precio) {
    const { error } = await supabaseClient
      .from('products').update({ price: precio }).eq('id', productId);
    if (error) showToast('Error', 'error');
    else showToast(`$${formatear(precio)}`);
  }

  function evaluarExpresion(expresion) {
    let expr = expresion.replace(/,/g, '.');
    if (!/^[\d+\-*/().\s]+$/.test(expr)) throw new Error('Caracteres no permitidos');
    const resultado = new Function('return ' + expr)();
    return Math.round(resultado * 100) / 100;
  }

  async function recargarDatos() {
    try {
      const { data, error } = await supabaseClient
        .from('products').select('*').order('created_at', { ascending: false });
      if (!error && data) { productos = data; renderizar(); }
    } catch (e) { console.error('Error:', e); }
  }

  async function nuevoProducto() {
    modalAbierto = true;

    const { value: formValues, isConfirmed } = await Swal.fire({
      title: 'Nuevo producto',
      html: `
        <input id="swal-nombre" class="swal2-input" placeholder="Nombre del producto" autocomplete="off">
        <select id="swal-categoria" class="swal2-select">
          <option value="otros">Otros</option>
          <option value="lacteos">Lácteos</option>
          <option value="carnes">Carnes</option>
          <option value="verduras">Verduras</option>
          <option value="frutas">Frutas</option>
          <option value="panaderia">Panadería</option>
          <option value="bebidas">Bebidas</option>
          <option value="despensa">Despensa</option>
          <option value="limpieza">Limpieza</option>
          <option value="farmacia">Farmacia</option>
          <option value="vehiculo">Vehículo</option>
        </select>
      `,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: 'Agregar',
      cancelButtonText: 'Cancelar',
      position: 'top',
      customClass: { container: 'modal-top' },
      preConfirm: () => {
        const nombre = document.getElementById('swal-nombre').value;
        const categoria = document.getElementById('swal-categoria').value;
        if (!nombre || nombre.trim() === '') {
          Swal.showValidationMessage('Escribe un nombre');
          return;
        }
        return { nombre: nombre.trim(), categoria };
      },
      didOpen: () => {
        setTimeout(() => {
          const input = document.getElementById('swal-nombre');
          if (input) input.focus();
        }, 100);
      }
    });

    modalAbierto = false;

    if (isConfirmed && formValues) {
      showLoader(true);
      try {
        const { error } = await supabaseClient
          .from('products')
          .insert([{
            name: formValues.nombre,
            category: formValues.categoria,
            price: 0,
            quantity: 1,
            status: 'pending'
          }]);
        if (error) throw error;
        showToast('Agregado');
        await recargarDatos();
      } catch (error) {
        showToast('Error', 'error');
      } finally {
        showLoader(false);
      }
    }
  }

  async function ajustarCantidad(id, nuevaCantidad) {
    if (nuevaCantidad < 1) return;
    const { error } = await supabaseClient
      .from('products').update({ quantity: nuevaCantidad }).eq('id', id);
    if (error) showToast('Error', 'error');
  }

  async function cambiarEstado(id, estadoActual) {
    const producto = productos.find(p => p.id === id);
    if (!producto) return;
    const nuevoEstado = estadoActual === 'pending' ? 'purchased' : 'pending';

    try {
      const { error } = await supabaseClient
        .from('products').update({ status: nuevoEstado }).eq('id', id);
      if (error) { showToast('Error', 'error'); return; }

      if (nuevoEstado === 'purchased') {
        ultimoProductoComprado = id;
        if (timeoutHighlight) clearTimeout(timeoutHighlight);
        mostrarNotificacionConUndo(producto.name, id);
      }
    } catch (error) {
      showToast('Error', 'error');
    }
  }

  function mostrarNotificacionConUndo(nombre, productId) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast-purchase';
    toast.innerHTML = `
      <span>${ICON_CHECK.replace('stroke-width="3"', 'stroke-width="3" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;"')} <b>${escapeHtml(nombre)}</b></span>
      <button class="undo-btn" onclick="deshacerUltimaCompra('${productId}')">Deshacer</button>`;
    container.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4500);
  }

  async function deshacerUltimaCompra(productId) {
    try {
      await supabaseClient.from('products').update({ status: 'pending' }).eq('id', productId);
      showToast('Devuelto a la lista');
      document.querySelectorAll('.toast-purchase').forEach(t => t.remove());
    } catch (error) {
      showToast('Error', 'error');
    }
  }

  async function borrarProducto(id, nombre) {
    const result = await Swal.fire({
      title: '¿Eliminar producto?',
      text: `"${nombre}"`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Eliminar',
      cancelButtonText: 'Cancelar',
      position: 'top',
      customClass: { container: 'modal-top' }
    });

    if (result.isConfirmed) {
      showLoader(true);
      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      showLoader(false);
      if (error) showToast('Error', 'error');
      else showToast('Eliminado');
    }
  }

  async function archivar() {
    const comprados = productos.filter(p => p.status === 'purchased');
    if (comprados.length === 0) {
      Swal.fire({
        icon: 'info', title: 'Carrito vacío',
        position: 'top',
        customClass: { container: 'modal-top' }
      });
      return;
    }

    const total = comprados.reduce((s, p) => s + ((p.price || 0) * (p.quantity || 1)), 0);

    const result = await Swal.fire({
      title: '¿Archivar carrito?',
      html: `<div style="font-size:13.5px;"><b>${comprados.length}</b> productos · <b style="color:var(--brand);">$${formatear(total)}</b></div>`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Archivar',
      cancelButtonText: 'Cancelar',
      position: 'top',
      customClass: { container: 'modal-top' }
    });

    if (result.isConfirmed) {
      showLoader(true);
      try {
        const historial = comprados.map(p => ({
          product_name: p.name,
          price: p.price || 0,
          quantity: p.quantity || 1,
          total: (p.price || 0) * (p.quantity || 1)
        }));
        await supabaseClient.from('purchase_history').insert(historial);
        const ids = comprados.map(p => p.id);
        await supabaseClient.from('products').update({ status: 'pending' }).in('id', ids);
        showLoader(false);
        Swal.fire({
          icon: 'success', title: 'Archivado',
          text: `$${formatear(total)}`,
          position: 'top',
          customClass: { container: 'modal-top' }
        });
      } catch (error) {
        showLoader(false);
        showToast('Error', 'error');
      }
    }
  }

  async function mostrarHistorial() {
    showLoader(true);
    try {
      const { data, error } = await supabaseClient
        .from('purchase_history').select('*')
        .order('archived_date', { ascending: false }).limit(50);
      showLoader(false);
      if (error) throw error;

      if (!data || data.length === 0) {
        Swal.fire({
          icon: 'info', title: 'Sin historial',
          position: 'top',
          customClass: { container: 'modal-top' }
        });
        return;
      }

      const porFecha = {};
      data.forEach(item => {
        const fecha = new Date(item.archived_date).toLocaleDateString('es-ES');
        if (!porFecha[fecha]) porFecha[fecha] = { items: [], total: 0 };
        porFecha[fecha].items.push(item);
        porFecha[fecha].total += item.total;
      });

      let html = '<div style="text-align:left;max-height:60vh;overflow-y:auto;">';
      Object.keys(porFecha).forEach(fecha => {
        const c = porFecha[fecha];
        c.items.sort((a, b) =>
          a.product_name.toLowerCase().localeCompare(b.product_name.toLowerCase(), 'es', { sensitivity: 'base' })
        );

        html += `
          <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--line-strong);">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;margin-bottom:6px;color:var(--ink);">${fecha}</div>
            <div style="font-size:11px;color:var(--ink-3);">${c.items.length} productos</div>
            <div style="display:flex;justify-content:space-between;">
              <span style="font-size:11px;color:var(--ink-3);">Total</span>
              <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--brand);">$${formatear(c.total)}</span>
            </div>
            <details style="margin-top:6px;">
              <summary style="font-size:11px;color:var(--brand);cursor:pointer;">Ver detalles</summary>
              <div style="margin-top:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;">
                ${c.items.map(i => `
                  <div style="display:flex;justify-content:space-between;padding:3px 0;">
                    <span style="font-family:'Inter',sans-serif;">${i.product_name} ×${i.quantity}</span>
                    <span>$${formatear(i.total)}</span>
                  </div>`).join('')}
              </div>
            </details>
          </div>`;
      });
      html += '</div>';

      Swal.fire({
        title: 'Historial de compras',
        html, width: 600,
        confirmButtonText: 'Cerrar',
        position: 'top',
        customClass: { container: 'modal-top modal-historial' }
      });
    } catch (error) {
      showLoader(false);
      showToast('Error', 'error');
    }
  }

  async function actualizarTasa(valor) {
    const tasa = parseFloat(valor.replace(',', '.')) || 36.50;
    const { error } = await supabaseClient
      .from('config').update({ exchange_rate: tasa }).eq('id', 1);
    if (error) showToast('Error', 'error');
    else { exchangeRate = tasa; renderizar(); showToast('Tasa actualizada'); }
  }

  function formatear(num) { return (num || 0).toFixed(2).replace('.', ','); }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'block' : 'none';
  }

  function marcarOnline(status) {
    document.getElementById('statusDot').className = `dot ${status ? 'online' : 'offline'}`;
    document.getElementById('statusText').innerText = status ? 'En línea' : 'Sin conexión';
  }

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `custom-toast ${type === 'error' ? 'error' : ''}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
  }

  window.addEventListener('beforeunload', () => {
    if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  });
</script>
</body>
</html>
